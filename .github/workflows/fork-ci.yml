name: Fork CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Build, lint and compiler tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-noble-lg
    timeout-minutes: 15
    env:
      SCRIPTC_TEST_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - name: Validate fork workflows
        run: pnpm dlx github-actionlint@1.7.12 -config-file .github/actionlint.yaml .github/workflows/fork-ci.yml .github/workflows/sync-upstream.yml .github/workflows/release.yml
      - run: pnpm generate:ts7-ast --check
      - run: pnpm test:ts7 --baselines-only
      - name: Compiler and automation regressions
        run: >-
          pnpm test
          packages/compiler/src/ir
          packages/compiler/src/frontend/lowering
          packages/compiler/src/backend/llvm/alloc.test.ts
          packages/compiler/src/backend/llvm/bag-inputs.test.ts
          packages/compiler/src/backend/llvm/stable-capture-inputs.test.ts
          packages/compiler/src/library/library-profile.test.ts
          tests/harness/code-quality.test.ts
          tests/harness/ci-stack-scope.test.ts
          tests/harness/sync-upstream.test.ts
          tests/harness/release-integrity.test.ts

  native:
    name: Native and JSC (${{ matrix.flavor }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-xl
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [plain, asan]
    env:
      SCRIPTC_TEST_WORKERS: "2"
      SCRIPTC_SAN: ${{ matrix.flavor == 'asan' && '1' || '0' }}
      TERM: xterm-256color
      ASAN_OPTIONS: detect_leaks=0
      ASAN_SYMBOLIZER_PATH: /usr/bin/atos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install native build tools
        run: brew install cmake ninja llvm@22
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/native-packages
        with:
          target: darwin-arm64
      - run: pnpm build
      - name: Native library regressions
        run: >-
          pnpm test
          packages/runtime/src/scr_alloc.test.ts
          packages/runtime/test/json.test.ts
          packages/compiler/test/js-hoisted-open-record.test.ts
          packages/compiler/test/js-nullable-constructor.test.ts
          packages/compiler/test/receiverless-local-methods.test.ts
          packages/compiler/test/library-dispose.test.ts
          packages/compiler/test/library-thread-allocator.test.ts
      - name: JavaScriptCore lifetime tests
        run: node scripts/test-jsc.mjs

  checks:
    name: Fork checks
    if: always()
    needs: [quality, native]
    runs-on: ubuntu-noble-xs
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$QUALITY" = success && test "$NATIVE" = success

  release:
    name: Release new version
    needs: checks
    if: github.repository == 'zshannon/scriptc' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
